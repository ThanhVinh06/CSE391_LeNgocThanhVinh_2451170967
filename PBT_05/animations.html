<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiệu Ứng CSS Animations</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <header class="header">
        <h1>ShopTLU Animations</h1>
    </header>

        <h2>Hiệu ứng Loading Spinner</h2>

    </section>

    <section class="products fade-in">

                <img src="" alt="Sản phẩm">
            </div>

            <h3>Giày Thể Thao Nike</h3>
            <p>2.500.000đ</p>

            <button>Mua ngay</button>
        </div>

        <div class="product-card">

            <div class="image-container">
                <img src="" alt="Sản phẩm">
            </div>

            <h3>Tai Nghe Bluetooth</h3>
            <p>950.000đ</p>

            <button>Mua ngay</button>
        </div>

        <div class="product-card">

            <div class="image-container">
                <img src="" alt="Sản phẩm">
            </div>

            <h3>Bàn Phím Cơ RGB</h3>
            <p>1.700.000đ</p>

            <button>Mua ngay</button>
        </div>
    </section>

</body>
</html>
