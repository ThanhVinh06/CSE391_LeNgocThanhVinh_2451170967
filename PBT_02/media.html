<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Giới thiệu sản phẩm</title>
</head>
<body>

<h1>Giới thiệu sản phẩm</h1>

<!-- Ảnh sản phẩm -->
<h2>Hình ảnh sản phẩm</h2>

<figure>
    <img src=""
         alt="iPhone 16 Pro Max màu đen, mặt trước"
         loading="lazy"
         style="max-width: 100%; height: auto;">
    <figcaption>iPhone 16 Pro Max - Mặt trước</figcaption>
</figure>

<figure>
    <img src="img2.jpg"
         alt="iPhone 16 Pro Max mặt sau với camera"
         loading="lazy"
         style="max-width: 100%; height: auto;">
    <figcaption>iPhone 16 Pro Max - Mặt sau</figcaption>
</figure>

<figure>
    <img src="img3.jpg"
         alt="iPhone 16 Pro Max hiển thị màn hình"
         loading="lazy"
         style="max-width: 100%; height: auto;">
    <figcaption>iPhone 16 Pro Max - Màn hình</figcaption>
</figure>

<!-- Video YouTube -->
<h2>Video giới thiệu (YouTube)</h2>

<iframe width="560" height="315"
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        title="Video giới thiệu sản phẩm"
        frameborder="0"
        allowfullscreen>
</iframe>

<!-- Video local -->
<h2>Video sản phẩm</h2>

<video controls poster="poster.jpg" width="560">
    <source src="video.mp4" type="video/mp4">
    <source src="video.webm" type="video/webm">
    Trình duyệt không hỗ trợ video.
</video>

<!-- Audio -->
<h2>Nhạc nền</h2>

<audio controls>
    <source src="audio.mp3" type="audio/mpeg">
    Trình duyệt không hỗ trợ audio.
</audio>

<!-- SVG -->
<h2>Logo (SVG)</h2>

<svg width="100" height="100">
    <circle cx="50" cy="50" r="40" fill="blue" />
    Trình duyệt không hỗ trợ SVG.
</svg>

</body>
</html>
