<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning Playground</title>

    <link rel="stylesheet" href="positioning.css">
</head>
<body>

    <!-- FIXED HEADER -->
    <header class="header">
        <div class="logo">ShopTLU</div>

        <nav class="nav">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- MAIN LAYOUT -->
    <div class="container">

        <!-- CONTENT -->
        <main class="content">

            <h1>Danh sách sản phẩm</h1>

            <div class="products">

                <!-- PRODUCT CARD -->
                <div class="product-card">
                    <div class="badge">HOT</div>

                    <img src="https://via.placeholder.com/250x150"
                         alt="product">

                    <h3>Gaming Mouse</h3>
                    <p>Giá: 500.000đ</p>
                </div>

                <div class="product-card">
                    <div class="badge">HOT</div>

                    <img src="https://via.placeholder.com/250x150"
                         alt="product">

                    <h3>Mechanical Keyboard</h3>
                    <p>Giá: 1.200.000đ</p>
                </div>

                <div class="product-card">
                    <div class="badge">HOT</div>

                    <img src="https://via.placeholder.com/250x150"
                         alt="product">

                    <h3>Gaming Headset</h3>
                    <p>Giá: 800.000đ</p>
                </div>

                <div class="product-card">
                    <div class="badge">HOT</div>

                    <img src="https://via.placeholder.com/250x150"
                         alt="product">

                    <h3>Monitor 24 inch</h3>
                    <p>Giá: 3.500.000đ</p>
                </div>

            </div>

        </main>

        <!-- STICKY SIDEBAR -->
        <aside class="sidebar">
            <h2>Danh mục</h2>

            <ul>
                <li>Laptop</li>
                <li>Chuột</li>
                <li>Bàn phím</li>
                <li>Tai nghe</li>
                <li>Màn hình</li>
            </ul>
        </aside>

    </div>

    <!-- SCROLL TO TOP -->
    <button class="scroll-top">
        ↑
    </button>

</body>
</html>
